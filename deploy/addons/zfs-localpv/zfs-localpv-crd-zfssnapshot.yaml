apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zfssnapshots.zfs.openebs.io
spec:
  group: zfs.openebs.io
  names:
    kind: ZFSSnapshot
    listKind: ZFSSnapshotList
    plural: zfssnapshots
    shortNames:
      - zfssnap
      - zs
    singular: zfssnapshot
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                capacity:
                  type: string
                fsType:
                  type: string
                ownerNodeID:
                  type: string
                poolName:
                  type: string
                snapname:
                  type: string
                volumeType:
                  type: string
            status:
              type: object
              properties:
                state:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ZPool
          type: string
          jsonPath: .spec.poolName
        - name: Node
          type: string
          jsonPath: .spec.ownerNodeID
        - name: Status
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
